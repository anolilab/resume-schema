# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Semantic Release"

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "([0-9])?(.{+([0-9]),x}).x"
            - "main"
            - "next"
            - "next-major"
            - "alpha"
            - "beta"

# Enable this to use the github packages
# yamllint disable-line rule:comments
#env:
#    package: "@${{ github.repository }}"
#    registry_url: "https://npm.pkg.github.com"
#    scope: "${{ github.repository_owner }}"

permissions:
  contents: read

jobs:
    semantic-release:
        name: "Semantic Release"

        runs-on: "ubuntu-latest"

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
              with:
                egress-policy: audit

            - name: "Git checkout"
              uses: "actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5" # v2.7.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - uses: "pnpm/action-setup@646cdf48217256a3d0b80361c5a50727664284f2" # v2.0.1
              with:
                  version: 6

            - name: "Set node version to ${{ matrix.node_version }}"
              uses: "actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8" # v2.5.2
              with:
                  node-version: "${{ matrix.node_version }}"
                  # Enable this to use the github packages
                  # registry-url: "${{ env.registry_url }}"
                  # Defaults to the user or organization that owns the workflow file
                  # scope: "@${{ env.scope }}"

            - name: "Install packages"
              run: "pnpm install --frozen-lockfile"

            - name: "Build packages"
              run: "pnpm run generate:types"

            - name: "Semantic Release"
              env:
                  GITHUB_TOKEN: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  NPM_TOKEN: "${{ secrets.NPM_AUTH_TOKEN }}"
                  GIT_AUTHOR_NAME: "github-actions-shell"
                  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
                  GIT_COMMITTER_NAME: "github-actions-shell"
                  GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
              run: "pnpm semantic-release"

    pnpm-lock-update:
        permissions:
          contents: write  # for stefanzweifel/git-auto-commit-action to push code in repo
        name: "pnpm-lock.yaml update"

        runs-on: "ubuntu-latest"

        needs: ["semantic-release"]

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
              with:
                egress-policy: audit

            - name: "Git checkout"
              uses: "actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5" # v2.7.0
              with:
                  fetch-depth: 2
                  token: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  ref: "${{ github.ref }}"
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - uses: "pnpm/action-setup@646cdf48217256a3d0b80361c5a50727664284f2" # v2.0.1
              with:
                  version: 6

            - name: "Use Node.js 16.x"
              uses: "actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8" # v2.5.2
              with:
                  node-version: "16.x"
                  registry-url: "${{ env.registry_url }}"
                  # Defaults to the user or organization that owns the workflow file
                  scope: "@${{ env.scope }}"
                  always-auth: true

            - name: "Update pnpm lock"
              run: "pnpm install --no-frozen-lockfile"

            - name: "Commit modified files"
              uses: "stefanzweifel/git-auto-commit-action@5dd17c3b53a58c1cb5eaab903826abe94765ccd6" # v4.11.0
              with:
                  commit_message: "chore: updated pnpm-lock.yaml"
                  commit_author: "prisis <d.bannert@anolilab.de>"
                  commit_user_email: "d.bannert@anolilab.de"
                  commit_user_name: "prisis"
                  branch: "${{ github.head_ref }}"
